[project]
name = "r3trace"
version = "0.6.54"
description = "Inspectable long-context reasoning with evidence attribution."
readme = "README.md"
authors = [
    { name = "Michael Theologitis", email = "michael.theologitis@outlook.com" }
]
requires-python = ">=3.11"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES"]
keywords = ["llm", "agent", "documents", "reasoning", "multi-document", "question-answering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "litellm>=1.103,<2",
    # The first for 3.15: earlier ones declare Python <3.15 and need fastuuid.
    "litellm>=1.109; python_version >= '3.15'",
    "jinja2>=3.1.0",
    # A run folder's lock (r3trace.runs.run_lock); litellm's own floor for it.
    "filelock>=3.16.1",
    # 2.14.0 locks model_rebuild (pydantic#13419): threads' first calls raced before it.
    "pydantic>=2.14",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0",
    # cryptodome: pycryptodome, to read AES-encrypted PDFs, with wheels for every platform.
    "pypdf[cryptodome]>=6.19.0",
    # 1.12.2 fixes a denial of service a crafted document could cause.
    "mammoth>=1.12.2",
    # The first with table_infer_header.
    "markdownify>=1.0.0",
    # The first with XMLParsedAsHTMLWarning, which r3trace silences.
    "beautifulsoup4>=4.11",
    # The first with Python 3.14 wheels that is not yanked.
    "rapidfuzz>=3.14.1",
    # The first with Python 3.15 wheels.
    "rapidfuzz>=3.14.6; python_version >= '3.15'",
]

[project.optional-dependencies]
# The app's page and its local server, `r3trace app` (r3trace.app).
app = [
    "keyring>=25",
    "platformdirs>=4.1",
    "starlette>=1.10",
    "uvicorn>=0.54",
]

# Local development only — NOT part of the published package (PEP 735 dependency groups
# never reach the wheel). uv installs the `dev` group by default, so a plain `uv sync`
# gives you an environment that can run examples/quickstart.ipynb as a notebook: pick
# .venv as the kernel and go. `pip` is here because editors shell out to it when they
# offer to fix a kernel themselves, and a uv-made venv has none. The rest are the
# checks and the test runner, the same ones CI runs, the app extra, for its tests, and
# Toga's core, for the Mac app's window (r3trace.app.window), whose Mac backend only the
# Mac app bundles.
[dependency-groups]
dev = [
    "r3trace[app]",
    "httpx2>=2.16",
    "ipykernel>=6.29",
    "pip>=24.0",
    "pyright>=1.1.414",
    # 9.1 drops a folder's conftest fixtures when the folder comes up twice (pytest#14635).
    "pytest>=9.2",
    "pytest-cov>=7.0",
    "pytest-httpserver>=1.1",
    "pytest-socket>=0.8",
    "ruff>=0.16",
    "toga-core>=0.5.7,<0.6",
]
# Toga's Mac backend, which the Mac app bundles and nothing installs here: it is in the
# group only so that uv.lock pins it, and its dependencies, for the app's build.
mac-app = ["toga-cocoa>=0.5.7,<0.6; sys_platform == 'darwin'"]
# [build-system]'s backend, locked so that the Mac app's build of this project uses
# uv.lock's version and files. If the two ranges part, that build fails in pip.
build-backend = ["uv_build>=0.9.17,<0.10.0"]

[project.scripts]
r3trace = "r3trace.cli:main"

[project.urls]
Homepage = "https://github.com/michaeltheologitis/r3trace"
Repository = "https://github.com/michaeltheologitis/r3trace"

# The Mac app, which .github/workflows/mac-app.yml builds: Briefcase bundles Python, this
# project with its app extra, and Toga, and starts the app as `python -m r3trace`, which
# opens the window there. Its version, description, license and author are [project]'s.
# Briefcase would make its bundle identifier `bundle` and the app's name joined;
# mac-app.yml sets it to BUNDLE_ID instead, r3con's from before the rename
# (io.github.michaeltheologitis.r3con), which must never change: it is also the
# service its keys are saved under in the Keychain (r3trace.app.server's
# MAC_APP_KEY_SERVICE).
# formal_name, the name it shows in Finder, the Dock, its menu and its window's title,
# can, with r3trace.app.window's FORMAL_NAME, which Toga is given.
[tool.briefcase]
bundle = "io.github.michaeltheologitis"

[tool.briefcase.app.r3trace]
formal_name = "R3Trace"
# Briefcase adds the platform's extension: icons/r3trace.icns on macOS.
icon = "icons/r3trace"
# Briefcase needs the app's package among its sources. The project is installed as a
# requirement too, for its app extra's packages and for its metadata, which
# r3trace.__version__ reads. Briefcase installs with --only-binary, which a local
# directory is exempt from.
sources = ["src/r3trace"]
requires = [".[app]"]
# Only the wheels that mac-app.yml downloads to build/wheels, by uv.lock's hashes.
requirement_installer_args = ["--no-index", "--find-links", "./build/wheels"]

[tool.briefcase.app.r3trace.macOS]
# At the version the mac-app group locks.
requires = ["toga-cocoa"]
# Apple Silicon only. A universal build fails to merge charset_normalizer: its only
# arm64 wheel is universal2, and Briefcase reinstalls it, thinned, for x86_64.
universal_build = false
# The window loads its page from the app's own server, over http on 127.0.0.1.
info.NSAppTransportSecurity.NSAllowsLocalNetworking = true
# SUPublicEDKey's private key is in the macos-signing environment, as
# SPARKLE_PRIVATE_KEY, and in Michael's keychain; should it be lost, a Developer ID
# signed .dmg can still bring a new one.
info.SUFeedURL = "https://github.com/michaeltheologitis/r3trace/releases/latest/download/appcast.xml"
info.SUPublicEDKey = "Y0OgZCH+tOMwSpNxMk+mbWL9//i+DHpsvDREzuwaHUU="
info.SUVerifyUpdateBeforeExtraction = true
info.SURequireSignedFeed = true

[tool.ruff]
extend-exclude = ["src/r3trace/runtime/python_executor.py"]

[tool.pyright]
# tests/app keeps the type checks it had as the app's own project.
include = ["src", "evals", "tests/app", "tests/fakes.py"]
exclude = ["src/r3trace/runtime/python_executor.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so the tests can import the evals package, which is not installed.
pythonpath = ["."]
addopts = [
    "-m",
    "not live",
    "--disable-socket",
    "--allow-unix-socket",
    "--strict-markers",
]
markers = [
    "live: calls a real provider; runs only under `pytest -m live`",
    "experiment: a measured run against a real provider, dispatched once; also marked live",
]

[tool.coverage.run]
omit = ["*/r3trace/runtime/python_executor.py"]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"
