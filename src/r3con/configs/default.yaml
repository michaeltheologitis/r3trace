# The default run config. Everything here shapes the OUTPUT — model, relevance rounds,
# the reasoning path, the evidence level, claims, prompt versions, generation params — and
# together these are a run's identity (RunConfig.label()). Runtime knobs (parallelism,
# retry caps, where logs go) live in settings.py, not here.
#
# Override single fields at the call site or on the CLI. For a different experiment, add
# another configs/<name>.yaml (yours are picked up from ./configs) and select it by name.

# Any litellm model string: openai/…, anthropic/…, gemini/…, hosted_vllm/…, ollama/…
model: openai/gpt-6-luna

# How many times each document is read. 1 = each read against the question alone;
# 2+ = re-read in light of the other documents' relevance summaries.
relevance_rounds: 2

# How reasoning answers. direct = one call over the summaries and the whole parse;
# coding = an agent that reads the parse with code, and runs when direct does not fit.
reasoning: direct

# What relevance records as evidence. sentence = each summary with the sentences it
# is based on, quoted; document = the summary alone, so the trail ends at documents.
evidence_level: sentence

# Whether the last calls find the answer's claims, each sentence, clause, list item or
# table row, with the evidence on its trail that supports it. At the sentence level, one
# call splits the answer into claims, then one call per claim links it to the quotes
# that directly support it; at the document level, one call does both, with documents.
claims: true

prompts:
  relevance/first-round: v3
  relevance/later-rounds: v4
  structuring/schema: v2
  structuring/parsing: v4
  reasoning/direct: v5
  reasoning/coding: v4
  claims: v3
  linking: v1

# Passed straight to litellm.completion — temperature, top_p, seed, extra_body, anything
# it accepts. Empty means provider defaults.
params: {}
